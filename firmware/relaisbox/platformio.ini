; Relaisbox fuer HA Wecker - ESP32-S3-DevKitC-1 (N16R8)
;
;   pio run -e esp32s3 -t upload
;
; WLAN-Zugangsdaten stehen in secrets.ini (nicht im Repo, Vorlage
; secrets.ini.beispiel). Ohne Datei startet die Box ein Einrichtungs-WLAN.

[platformio]
extra_configs = secrets.ini

; Vorgabe, falls keine secrets.ini da ist
[secrets]
wifi_ssid =
wifi_pass =

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Kein PSRAM einschalten: auf dem N16R8-Modul haengt das Octal-PSRAM intern an
; GPIO 33-37. Solange es nicht initialisiert wird, bleiben 35-37 als GPIO nutzbar.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASS="${secrets.wifi_pass}"'
