; Relaisbox fuer HA Wecker - ESP32-S3-DevKitC-1 (N16R8)
;
;   pio run -e esp32s3 -t upload
;
; WLAN-Zugangsdaten stehen in secrets.ini (nicht im Repo, Vorlage
; secrets.ini.beispiel). Ohne Datei startet die Box ein Einrichtungs-WLAN.

[platformio]
extra_configs = secrets.ini

; Vorgabe, falls keine secrets.ini da ist
[secrets]
wifi_ssid =
wifi_pass =

; Gemeinsames
[esp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Kein PSRAM einschalten. Das N16R8-Modul hat sein Octal-PSRAM intern an
; GPIO 33-37; diese Pins sind auch ohne PSRAM-Init nicht brauchbar (siehe main.cpp).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASS="${secrets.wifi_pass}"'

; Module auf HIGH-Trigger an 3,3 V (Gegentakt-Ausgaenge)
[env:esp32s3]
extends = esp

; Module auf LOW-Trigger an 5 V: Ausgaenge Open-Drain, das Modul liefert den
; 5-V-Pegel selbst. Flashen: pio run -e esp32s3-lowtrigger -t upload
[env:esp32s3-lowtrigger]
extends = esp
build_flags =
    ${esp.build_flags}
    -DRELAIS_LOW_OPEN_DRAIN

; Nur eine Lampe: ein Ausgang an GPIO 1 (HIGH-Trigger, z. B. F5305S-Modul),
; kein Taster, kein GPIO 42. Flashen: pio run -e esp32s3-lampe -t upload
[env:esp32s3-lampe]
extends = esp
build_flags =
    ${esp.build_flags}
    -DNUR_LAMPE
    -DLAMPE_GPIO=1
