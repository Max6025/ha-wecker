# Beispiel: 15 Minuten vor dem naechsten Wecker Rollo hoch
- alias: "Rollo vor dem Wecker"
  trigger:
    - platform: template
      value_template: >-
        {{ state_attr('sensor.wecker_naechster','next_alarm')
           and as_timestamp(states('sensor.wecker_naechster'), 0) - as_timestamp(now())
               <= 900 }}
  condition:
    - condition: template
      value_template: "{{ states('sensor.wecker_naechster') not in ['unknown','unavailable'] }}"
  action:
    - service: cover.open_cover
      target:
        entity_id: cover.schlafzimmer

# Beispiel: Licht an, sobald der Wecker klingelt
- alias: "Licht beim Weckruf"
  trigger:
    - platform: state
      entity_id: binary_sensor.wecker_klingelt
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.schlafzimmer
      data:
        brightness_pct: 40

# Beispiel: Wecker aus HA heraus abschalten
- alias: "Wecker 1 deaktivieren"
  trigger:
    - platform: state
      entity_id: input_boolean.urlaub
      to: "on"
  action:
    - service: rest_command.wecker_aus
      data:
        id: 1
